services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_USER: postgres
      PG_DB: mimalyzer
      PG_PASSWORD: secret
  postgres:
    image: "postgres:17"
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mimalyzer
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mimalyzer"]
      interval: 2s
      timeout: 5s
      retries: 15
